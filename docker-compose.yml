services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../dlrgvolumes/data:/data
      - ../dlrgvolumes/config:/config
      - ./CaddyFile:/etc/caddy/Caddyfile:ro
    networks:
      - proxy-network

  dlrgweb:
    container_name: dlrgWeb
    #image: adjeko/dlrgtrack:latest
    build:
      context: .
    privileged: false
    restart: unless-stopped
    ports:
      - "3000:3000"
    #volumes:
    #  - ../dlrgvolumes/webApp:/app
    networks:
      - proxy-network
  
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    command:
      #- --encryptionEnv #optional
      #- ENCRYPTION #optional
    environment:
      ENCRYPTION: example #optional
    ports:
      - "8090:8090"
    volumes:
      - ../dlrgvolumes/pocketbase_data:/pb_data
      - ../dlrgvolumes/pocketbase_public:/pb_public #optional
    healthcheck: #optional (recommended) since v0.10.0
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy-network

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing #optional
    user: root
    privileged: true
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - ../syncthing_config:/config
      - ../:/allDockerData
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge